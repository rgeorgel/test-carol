<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Image Mouse Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>3D Image Mouse Effect</h1>
        <p>Hover over the image to see the 3D effect!</p>

        <div class="card">
            <div class="card-inner">
                <!-- Background layer - moves slowest -->
                <div class="parallax-layer background-layer" data-speed="0.3">
                    <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#4ECDC4;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#45B7D1;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <rect width="600" height="400" fill="url(#bgGrad)"/>
                    </svg>
                </div>

                <!-- Middle layer 1 - medium speed -->
                <div class="parallax-layer middle-layer-1" data-speed="0.5">
                    <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="150" cy="100" r="80" fill="rgba(255, 217, 61, 0.4)"/>
                        <circle cx="500" cy="80" r="60" fill="rgba(107, 203, 119, 0.4)"/>
                    </svg>
                </div>

                <!-- Middle layer 2 - faster speed -->
                <div class="parallax-layer middle-layer-2" data-speed="0.7">
                    <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="450" cy="300" r="100" fill="rgba(255, 255, 255, 0.3)"/>
                    </svg>
                </div>

                <!-- Text layer - medium-fast speed -->
                <div class="parallax-layer text-layer" data-speed="0.6">
                    <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
                        <text x="300" y="180" font-family="Arial, sans-serif" font-size="48"
                              font-weight="bold" fill="white" text-anchor="middle">
                            3D Effect Demo
                        </text>
                        <text x="300" y="230" font-family="Arial, sans-serif" font-size="24"
                              fill="rgba(255,255,255,0.9)" text-anchor="middle">
                            Move your mouse around!
                        </text>
                    </svg>
                </div>

                <!-- Foreground layer - moves fastest -->
                <div class="parallax-layer foreground-layer" data-speed="1">
                    <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="100" cy="350" r="40" fill="rgba(255, 255, 255, 0.6)"/>
                        <circle cx="520" cy="320" r="50" fill="rgba(255, 255, 255, 0.5)"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
