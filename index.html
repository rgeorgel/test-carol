<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Image Mouse Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>3D Image Mouse Effect</h1>
        <p>Hover over the image to see the 3D effect!</p>

        <div class="card">
            <div class="card-inner">
                <!-- Background layer - moves slowest -->
                <div class="parallax-layer background-layer" data-speed="0.2">
                    <img src="artwork.jpg" alt="Art Nouveau Artwork">
                </div>

                <!-- Middle layer 1 - medium speed, semi-transparent copy for depth -->
                <div class="parallax-layer middle-layer-1" data-speed="0.5">
                    <img src="artwork.jpg" alt="Art Nouveau Artwork" style="opacity: 0.3;">
                </div>

                <!-- Middle layer 2 - faster speed, more transparent -->
                <div class="parallax-layer middle-layer-2" data-speed="0.7">
                    <img src="artwork.jpg" alt="Art Nouveau Artwork" style="opacity: 0.15;">
                </div>

                <!-- Foreground accent layer - moves fastest -->
                <div class="parallax-layer foreground-layer" data-speed="1">
                    <div class="accent-glow"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
